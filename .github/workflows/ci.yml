name: JastipNisa CI

on:
  push:
    branches: [SOWAN, main, "codex/**"]
  pull_request:
    branches: [SOWAN, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Standard preview build
        run: npm run build
      - name: Build React single-file for Apps Script
        run: npm run build:gas
      - name: Validate Apps Script bundle and manifest
        run: npm run gas:validate
